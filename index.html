
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student To-Do List</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eef2ff;
            margin: 0;
            padding: 40px 15px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 25px #00000012;
        }

        h1 {
            text-align: center;
            color: #4338ca;
        }

        p {
            text-align: center;
            color: #666;
        }

        .input-area {
            display: flex;
            gap: 8px;
            margin: 25px 0;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #4f46e5;
            color: white;
        }

        button:hover {
            background: #3730a3;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            margin: 10px 0;
            background: #f3f4f6;
            border-radius: 8px;
            overflow-wrap: anywhere;
        }

        li span {
            flex: 1;
        }

        li.done span {
            text-decoration: line-through;
            color: #888;
        }

        .delete {
            background: #dc2626;
            padding: 8px 10px;
        }

        .delete:hover {
            background: #991b1b;
        }

        #count {
            text-align: center;
            margin-top: 20px;
            color: #4338ca;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>My To-Do List</h1>
        <p>Organize your study tasks!</p>

        <div class="input-area">
            <input id="taskInput"
                   type="text"
                   placeholder="Enter a new task...">
            <button onclick="addTask()">Add</button>
        </div>

        <ul id="taskList"></ul>
        <div id="count">0 tasks remaining</div>
    </div>

    <script>
        const input = document.getElementById("taskInput");
        const list = document.getElementById("taskList");
        const count = document.getElementById("count");

        function addTask() {
            const text = input.value.trim();

            if (text === "") {
                alert("Please enter a task!");
                return;
            }

            const item = document.createElement("li");
            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";

            const label = document.createElement("span");
            label.textContent = text;

            const del = document.createElement("button");
            del.textContent = "Delete";
            del.className = "delete";

            checkbox.addEventListener("change", () => {
                item.classList.toggle("done", checkbox.checked);
                updateCount();
            });

            del.addEventListener("click", () => {
                item.remove();
                updateCount();
            });

            item.append(checkbox, label, del);
            list.appendChild(item);

            input.value = "";
            input.focus();
            updateCount();
        }

        input.addEventListener("keydown", event => {
            if (event.key === "Enter") addTask();
        });

        function updateCount() {
            const items = list.querySelectorAll("li");
            const remaining = [...items].filter(
                item => !item.querySelector("input").checked
            ).length;

            count.textContent =
                remaining + " tasks remaining";
        }
    </script>
</body>
</html>
